[project]
name = "ai-assist-techsupport"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiogram>=3.29.1",
    "alembic>=1.18.5",
    "arize-phoenix>=17.12.0",
    "asyncio>=4.0.0",
    "dotenv>=0.9.9",
    "fastapi>=0.137.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "openai>=2.38.0",
    "openinference-instrumentation-openai>=0.1.52",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pypdf>=6.1.3",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.20",
    "pyyaml>=6.0.3",
    "redis>=8.0.0",
    "sqlalchemy[asyncio,postgresql-asyncpg]>=2.0",
    "sse-starlette>=3.4.4",
    "structlog>=26.1.0",
    "tenacity>=9.1.4",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
]

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.15",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["F401", "E501"]

[tool.pytest.ini_options]
addopts = "-p no:phoenix -p no:cacheprovider"
testpaths = ["tests"]
